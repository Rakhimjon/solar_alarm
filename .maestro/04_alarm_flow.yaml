appId: com.example.solarAlarm
---
# Flow 4: Test Dedicated Alarm System & Solar Rays Mission
- launchApp:
    clearState: false

- tapOn: "Uyg'otgich"
- assertVisible: "Uyg'otgich"

# Open Add Alarm Page
- tapOn:
    text: "Yangi Uyg'otgich"
    optional: true
- tapOn:
    text: "Uyg'otgich Qo'shish"
    optional: true

# Verify Add Alarm Page
- assertVisible: "Yangi Uyg'otgich"
- assertVisible: "Quyosh nurlari missiyasi"

# Switch to Solar mode
- tapOn: "☀️ Quyosh / Namoz"
- tapOn: "Bomdod 🌅"

# Save Alarm
- tapOn: "Saqlash"

# Verify returned to Alarm list and new item is visible
- assertVisible: "Uyg'otgich"
- assertVisible: "Bomdod"
