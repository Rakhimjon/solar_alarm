appId: com.example.solarAlarm
---
# Flow 2: Test Focus Timer & Hourglass
- launchApp:
    clearState: false

- tapOn: "Qumsoat"
- assertVisible: "Qumsoat Fokus"
- assertVisible: "Qat'iy rejim (Deep Work)"

# Select 25 min preset
- tapOn:
    text: ".*25.*"

# Start timer
- tapOn: "Boshlash"
- assertVisible: "Pauza"

# Pause timer
- tapOn: "Pauza"
- assertVisible: "Boshlash"
