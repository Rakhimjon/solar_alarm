appId: com.example.solarAlarm
---
# Flow 3: Test Daily Planner (navigation + "Yangi Reja" button)
#
# Note: the full type-and-save leg is intentionally omitted. After `inputText`
# focuses a Flutter TextField on iOS, Flutter stops exposing its semantics tree
# to Maestro's XCUITest driver (only the status bar remains visible), so the
# save button / task title cannot be located. This is a Flutter+Maestro iOS
# limitation, not a regression in this screen.
- launchApp:
    clearState: false

- tapOn: "Rejalar"
- assertVisible: "Kunlik Rejalar"

- tapOn: "Yangi Reja"
- assertVisible: "Yangi reja"
