name: solar_alarm
description: "A new Flutter project."
version: 1.0.0+1
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev



environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  alarm: ^5.15.0
  intl: ^0.20.3
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  shared_preferences: ^2.3.2
  freezed_annotation: ^2.4.4
  flutter_screenutil: ^5.9.3
  wakelock_plus: ^1.2.8
  permission_handler: ^12.0.3
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.3
  patrol: ^4.11.0

patrol:
  app_name: Solar Alarm
  test_directory: integration_test
  android:
    package_name: com.example.solar_alarm
  ios:
    bundle_id: com.example.solarAlarm

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F141C"
  adaptive_icon_foreground: "assets/icon.png"


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/alarm.wav
    - assets/loud_beep.wav
    - assets/siren_alarm.wav
    - assets/gentle_chime.wav

